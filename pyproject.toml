[project]
name = "taskbot"
version = "0.1.0"
description = "Turns tracker tickets into task records for a coding agent"
requires-python = ">=3.11"
dependencies = ["markdown-it-py>=3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
taskbot = "taskbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
